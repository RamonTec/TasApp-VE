<!doctype html>
<html lang="es" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Tasas BCV y USDT en tiempo real, conversor y calculadora de items" />
		<meta name="theme-color" content="#FAFAF9" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="TasApp VE" />
		<meta name="application-name" content="TasApp VE" />

		<link rel="preconnect" href="https://rsms.me/" />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/webfont/jetbrainsmono.css"
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('tasapp-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme = stored ?? (prefersDark ? 'dark' : 'light');
					document.documentElement.setAttribute('data-theme', theme);
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B0B0C' : '#FAFAF9');
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
